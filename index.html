/* Spacious trip overview, with a narrow reading column for each journal entry. */
:root {

  --fg: #1f2a22;
  --muted: #5f6d62;
  --line: #d9e0d6;
  --accent: #2f6b45;
  --accent-soft: #e2ede3;

}
@media (prefers-color-scheme: dark) {

}
:root[data-theme="dark"] {

* { box-sizing: border-box; }

nav.top { display: flex; gap: 4px; font-size: .92rem; flex-wrap: wrap; }

nav.top a[aria-current="page"] { background: var(--accent-soft); }
nav.top a:hover, nav.top a[aria-current="page"] { color: var(--accent); }

a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
main { padding-block: 36px 64px; }

.quote { font-family: var(--display); font-size: 1.15rem; line-height: 1.7; border-left: 3px solid var(--accent); padding-left: 16px; margin: 1.6em 0 0; }

.table-wrap { overflow-x: auto; margin-top: 18px; }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }

.pager a { text-decoration: none; line-height: 1.5; min-height: 44px; padding-block: 8px; }

.pager small { display: block; color: var(--muted); }

.links { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 12px; }

.links small { color: var(--muted); font-size: .9rem; }

.cta { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 18px; background: var(--accent); color: var(--bg); padding: 10px 20px; border: 1px solid var(--accent); border-radius: 8px; text-decoration: none; font-weight: 600; }

figcaption { color: var(--muted); font-size: .86rem; margin-top: 6px; line-height: 1.5; }
.gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1.6em; }
.gallery figure { margin: 0; min-width: 0; }
.gallery img { aspect-ratio: 3 / 4; object-fit: cover; }
.home-view { max-width: 1120px; }

.film-section { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .8fr); align-items: center; gap: 36px; margin-top: 56px; padding: 32px; background: var(--accent-soft); border: 1px solid var(--line); border-radius: 18px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }

.shortcuts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }

.home-details { max-width: 760px; margin: 56px auto 0; }

footer { color: var(--muted); font-size: .85rem; padding-block: 0 40px; }

@media (max-width: 480px) {

  .trip-summary { gap: 12px; }
}

  <p class="section-lede">เริ่มจากการจองคิว แล้วค่อยเลือกการเดินทางและที่พัก อ่านตามลำดับหรือเลือกหัวข้อที่อยากรู้ได้เลย</p>
  <div class="journey-invite"><div><p class="eyebrow">2 วัน 1 คืน / เสาร์–อาทิตย์</p><h3>ตามเส้นทาง จากเมืองถึงน้ำตก</h3><p class="note">ดูจุดแวะ ที่พัก และน้ำตกในไทม์ไลน์เดียว พร้อมแผนที่ Google Maps ของแต่ละสถานที่</p><a class="cta" href="#journey">เปิดแผนที่และไทม์ไลน์ →</a></div><img src="img/rice-cloud.jpg" alt="ทุ่งนาบ้านนาเกียนระหว่างทริป" loading="lazy" width="180" height="200"></div>
  <h2>เส้นทางทีละขั้น</h2>
  <ol class="steps">${steps.map((s, i) => `<li><a href="#${s.id}"><span class="n">${i + 1}</span><span class="t">${s.title}</span><span class="d">${s.desc}</span></a></li>`).join("")}
  <li><a href="#cost"><span class="n">${steps.length + 1}</span><span class="t">สรุปค่าใช้จ่าย</span><span class="d">ดูราคาแต่ละรายการและคำนวณค่าใช้จ่ายที่หารกัน</span></a></li></ol>
  <div class="callout"><p><b>ก่อนออกเดินทาง</b></p><p>ตรวจสอบการเปิดเส้นทาง สภาพอากาศ และราคากับผู้ให้บริการอีกครั้ง ตัวเลขในบันทึกนี้มาจากทริปที่ผ่านมา</p><a class="back" href="#links">ดูช่องทางจองและติดต่อ →</a></div>
  </section>`;
}
function shortcuts(current = "") {
  return `<nav class="shortcuts" aria-label="เลือกหัวข้อในทริป">${[["journey", "แผนที่ทริป"], ["booking", "จองคิว"], ["omkoi", "การเดินทาง"], ["stay", "ที่พัก"], ["waterfall", "เดินน้ำตก"], ["cost", "งบประมาณ"]].map(([id, label]) => `<a href="#${id}"${current === id ? ' aria-current="page"' : ""}>${label}</a>`).join("")}</nav>`;
}
function timeline() {
  const day = tripDays[journeyDay];
  return `<h2 class="journey-day-title">${day.title}</h2><ol class="timeline">${day.stops.map((stop, i) => `<li class="${i === journeyStop ? "is-selected" : ""}" data-timeline-stop="${i}"><span class="timeline-dot" aria-hidden="true">${i + 1}</span><div class="stop-card"><span class="stop-time">${stop.time}</span><h3>${stop.title}</h3><p>${stop.detail}</p>${stop.image ? `<img src="img/${stop.image}" alt="${stop.imageAlt}" loading="lazy" width="360" height="120">` : ""}<div class="stop-actions">${stop.place ? `<button type="button" data-stop="${i}" aria-pressed="${i === journeyStop}" aria-controls="journey-map" aria-label="ดูแผนที่: ${stop.title}">ดูแผนที่ ↗</button>` : ""}<a href="#${stop.page}">อ่านรายละเอียด →</a></div></div></li>`).join("")}</ol>`;
}
function mapCard() {
  const placeKey = tripDays[journeyDay].stops[journeyStop].place;
  const place = tripPlaces[placeKey];
  return `<div class="map-heading"><p class="eyebrow">จุดแวะบนแผนที่ / GOOGLE MAPS</p><h2 id="map-place-name" tabindex="-1">${place.name}</h2><p class="note">${place.area}</p></div><div class="map-frame"><iframe src="${place.embed}" title="แผนที่ ${place.name}" width="600" height="380" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="map-caption"><a class="cta" href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(place.coordinates)}" target="_blank" rel="noopener">เปิดใน Google Maps ↗</a>${placeKey === "stay" ? `<div class="actions">${stayContact()}</div>` : ""}<p>แผนที่แสดงตำแหน่งสถานที่ เลือกจุดแวะในไทม์ไลน์เพื่อเปลี่ยนแผนที่ หากแผนที่ไม่แสดง ใช้ปุ่มด้านบนได้เลย</p></div>`;
}
function journey() {
  return `<a class="back" href="#home">← กลับหน้ารวม</a><div class="journey-heading"><p class="eyebrow">บันทึกเส้นทาง / 2 วัน 1 คืน</p><h1>จากเมือง สู่ทุ่งนา<br>แล้วเดินไปหาน้ำตก</h1><p class="lede">แผนทริปเสาร์–อาทิตย์จากเรื่องเล่าการเดินทาง เลือกวันและจุดแวะเพื่อดูสถานที่บนแผนที่</p></div>
  <div class="journey-days" role="group" aria-label="เลือกวันเดินทาง">${tripDays.map((day, i) => `<button type="button" data-day="${i}" aria-pressed="${i === journeyDay}" aria-controls="journey-timeline journey-map">วันที่ ${i + 1} · ${day.label}<span>${day.theme}</span></button>`).join("")}</div>
  <div class="journey-layout"><section id="journey-timeline" aria-label="จุดแวะตามลำดับ">${timeline()}</section><section class="journey-map" id="journey-map" aria-labelledby="map-place-name">${mapCard()}</section></div>
  <p class="journey-note">เวลาที่ระบุเป็นแนวทางจากทริปนี้ ปรับตามนัดรถและจังหวะการเดินของกลุ่ม พิกัดน้ำตกเป็นจุดหมายปลายทาง ไม่ใช่จุดจอดรถหรือจุดเริ่มเดิน โปรดยืนยันจุดนัดพบกับคนขับและไกด์ก่อนเดินทาง</p>
  <div class="actions"><a class="cta" href="#booking">ดูวิธีจองคิว →</a><a class="cta secondary" href="#cost">วางแผนค่าใช้จ่าย →</a></div>`;
}
function selectJourneyDay(day) {
  if (!Number.isInteger(day) || !tripDays[day]) return;
  journeyDay = day;
  journeyStop = tripDays[day].defaultStop;
  document.querySelectorAll("[data-day]").forEach(button => button.setAttribute("aria-pressed", String(Number(button.dataset.day) === day)));
  document.getElementById("journey-timeline").innerHTML = timeline();
  document.getElementById("journey-map").innerHTML = mapCard();
}
function selectJourneyStop(index) {
  const stop = tripDays[journeyDay].stops[index];
  if (!stop || !stop.place) return;
  journeyStop = index;
  document.querySelectorAll("[data-timeline-stop]").forEach(item => item.classList.toggle("is-selected", Number(item.dataset.timelineStop) === index));
  document.querySelectorAll("[data-stop]").forEach(button => button.setAttribute("aria-pressed", String(Number(button.dataset.stop) === index)));
  document.getElementById("journey-map").innerHTML = mapCard();
  if (window.matchMedia("(max-width: 760px)").matches) {
    document.getElementById("journey-map").scrollIntoView({ block: "start" });
    document.getElementById("map-place-name").focus({ preventScroll: true });
  }
}
function step(s) {
  const i = steps.indexOf(s), prev = steps[i - 1], next = steps[i + 1];
  const nextLink = next ? `<a class="r" href="#${next.id}"><small>ถัดไป</small>${next.title} →</a>` : `<a class="r" href="#cost"><small>ถัดไป</small>สรุปค่าใช้จ่าย →</a>`;
  return `<a class="back" href="#home">← กลับหน้ารวม</a>
  <article><p class="eyebrow">ขั้นที่ ${i + 1} จาก ${steps.length + 1}</p><h1>${s.title}</h1>
  <ul class="facts">${s.facts.map(f => `<li>${f}</li>`).join("")}</ul>${s.body}</article>
  <div class="pager">${prev ? `<a href="#${prev.id}"><small>ก่อนหน้า</small>← ${prev.title}</a>` : "<span></span>"}${nextLink}</div>${shortcuts(s.id)}`;
}
function cost() {
  const last = steps[steps.length - 1];
  return `<a class="back" href="#home">← กลับหน้ารวม</a>
  <article><p class="eyebrow">ขั้นที่ ${steps.length + 1} จาก ${steps.length + 1}</p><h1>สรุปค่าใช้จ่าย</h1>
  <p class="lede">แยกราคาต่อคนและรายการที่หารกัน เพื่อวางแผนงบให้เหมาะกับกลุ่มของคุณ</p>
  <div class="callout"><p><b>ก่อนรวมงบ:</b> ยืนยันว่าค่าที่พัก 700 บาทคิดต่อคนหรือต่อห้อง และค่ารถรวมไป–กลับหรือไม่ แล้วเผื่องบอาหารระหว่างทางและค่าใช้จ่ายส่วนตัวเพิ่มเติม</p></div>
  <div class="table-wrap"><table><thead><tr><th scope="col">รายการ</th><th scope="col">ราคา</th></tr></thead><tbody>
  ${costs.map(c => `<tr><td>${c[0]}<small>${c[2]}</small></td><td class="amt">${c[1]}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="note">ราคาทั้งหมดเป็นค่าใช้จ่ายจากช่วงที่ผมเดินทางไปนะครับ แนะนำให้ตรวจสอบราคาและรายละเอียดอีกครั้งก่อนจอง</p>
  <section class="budget-box" aria-labelledby="shared-title">
  <h2 id="shared-title">ลองหารค่าใช้จ่ายในกลุ่ม</h2>
  <p class="note">คำนวณเฉพาะไกด์ 1 กลุ่ม และหมูกระทะ 1 ชุด (ถ้าเลือกสั่ง) จากราคาในบันทึก ไม่ใช่งบรวมทั้งทริป</p>
  <label for="group-size">จำนวนคนที่ร่วมหาร</label>
  <select id="group-size">${Array.from({length: 10}, (_, i) => `<option value="${i + 1}"${i === 3 ? " selected" : ""}>${i + 1} คน</option>`).join("")}</select>
  <output id="shared-cost" for="group-size" aria-live="polite"></output>
  </section>
  <a class="cta" href="${BOOK}" target="_blank" rel="noopener">จองคิวน้ำตก ↗</a>
  <h2>ท้ายทริป</h2>
  <p>ผมอยากให้ทุกคนได้ลองไปสัมผัสน้ำตกห้วยน้ำเย็นด้วยตัวเองสักครั้งครับ เพราะบางสถานที่ ต่อให้ถ่ายรูปสวยแค่ไหน ก็ยังถ่ายทอดความรู้สึกตอนที่ได้ยืนอยู่ตรงนั้นจริง ๆ ออกมาได้ไม่หมด</p>
  <p>ทริปนี้ไม่ได้มีดีแค่ความสวยของน้ำตก แต่ยังมีความสุขเล็ก ๆ ระหว่างทาง ทั้งทุ่งนา แสงแดดยามเย็น ท้องฟ้าที่เต็มไปด้วยดวงดาว และช่วงเวลาที่ได้อยู่กับตัวเองท่ามกลางธรรมชาติ</p>
  <p class="quote">อย่ามัวแต่รอให้ทุกอย่างพร้อม แล้วค่อยออกเดินทางนะครับ แล้วอย่าลืมออกไปใช้ชีวิตกันนะครับ 🌿</p></article>
  <div class="pager"><a href="#${last.id}"><small>ก่อนหน้า</small>← ${last.title}</a><a class="r" href="#home"><small>กลับ</small>หน้ารวม</a></div>`;
}
function linkPage() {
  return `<h1>จองและติดต่อ</h1><p class="lede">ตรวจสอบข้อมูลกับผู้ให้บริการก่อนเดินทาง แตะเบอร์เพื่อโทร หรือเปิดเว็บไซต์ในแท็บใหม่</p>
  <ul class="links">
  <li><a href="tel:${STAY_PHONE}"><b>ลุงคาเด๊อะ · คาเด๊อะ โฮมสเตย์</b><small>สอบถามห้องว่างและจองที่พักบ้านนาเกียน</small><span class="host">โทร ${STAY_PHONE_LABEL}</span></a></li>
  <li><a href="${FB}" target="_blank" rel="noopener"><b>ค้นหาน้ำตกห้วยน้ำเย็นบน Facebook</b><small>เปิดผลการค้นหาเพื่อหาเพจและข่าวล่าสุดก่อนเดินทาง</small><span class="host">facebook.com ↗</span></a></li>
  <li><a href="${BOOK}" target="_blank" rel="noopener"><b>จองคิวน้ำตก</b><small>50 บาท/คน เลือกวันและเวลา และช่วยประสานหารถขึ้นบ้านแม่โขง</small><span class="host">huainamyen.netlify.app ↗</span></a></li>
  </ul>`;
}

function updateSharedCost() {
  const count = Number(document.getElementById("group-size").value);
  const money = value => value.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  document.getElementById("shared-cost").textContent = `ไกด์ ${money(350 / count)} บาท/คน · หมูกระทะ ${money(500 / count)} บาท/คน · รวมสองรายการ ${money(850 / count)} บาท/คน`;
}
function render(moveFocus = false) {
  const requested = location.hash.slice(1) || "home";
  if (requested === "view" && view.innerHTML) { view.focus({ preventScroll: true }); return; }
  const key = ["home", "journey", "cost", "links", ...steps.map(s => s.id)].includes(requested) ? requested : "home";
  const s = steps.find(x => x.id === key);
  view.classList.toggle("home-view", key === "home" || key === "journey");
  view.innerHTML = s ? step(s) : key === "journey" ? journey() : key === "cost" ? cost() : key === "links" ? linkPage() : home();
  const navKey = ["omkoi", "maekhong", "waterfall"].includes(key) ? "journey" : key === "booking" ? "links" : key;
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === navKey ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.title = s ? s.title + " · ห้วยน้ำเย็น" : key === "journey" ? "แผนที่และไทม์ไลน์ทริป · ห้วยน้ำเย็น" : key === "cost" ? "ค่าใช้จ่าย · ห้วยน้ำเย็น" : key === "links" ? "จองและติดต่อ · ห้วยน้ำเย็น" : "น้ำตกห้วยน้ำเย็น บ้านแม่โขง";
  if (key === "cost") {
    document.getElementById("group-size").addEventListener("change", updateSharedCost);
    updateSharedCost();
  }
  if (moveFocus) view.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
document.querySelector(".skip-link").addEventListener("click", event => {
  event.preventDefault();
  view.focus();
});
view.addEventListener("click", event => {
  const dayButton = event.target.closest("[data-day]");
  const stopButton = event.target.closest("[data-stop]");
  if (dayButton) selectJourneyDay(Number(dayButton.dataset.day));
  if (stopButton) selectJourneyStop(Number(stopButton.dataset.stop));
});
window.addEventListener("hashchange", () => render(true));
render();
</script>
</body>
</html>
