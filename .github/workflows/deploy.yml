name: Deploy (manual)

# Publishes the Vue site to GitHub Pages. Runs ONLY when started by hand from the Actions tab,
# and only if you type the confirmation — so the current site is never replaced by accident.
# Before the first run: Settings → Pages → Source = "GitHub Actions" (see docs/SETUP.md, "Go live").
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to replace the live site with this branch'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run verify:migration
      - run: npm run build
        env:
          VITE_BASE: /huainamyen/
          VITE_SITE_URL: https://nutweir.github.io/huainamyen
          # Repository → Settings → Secrets and variables → Actions → Variables (the anon key is public by design)
          VITE_BACKEND: ${{ vars.VITE_BACKEND || 'local' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
